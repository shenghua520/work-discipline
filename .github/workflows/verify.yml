name: Verify skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 有依赖路径：必须 fully verified（exit 0），两个平台都跑，顺手验掉路径分隔符
  verify-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Self-check (full)
        run: python scripts/verify_skill.py skills/work-discipline
      - name: Dist artifacts in sync
        run: python scripts/build_dist.py --check

  # 无依赖路径：必须 PARTIAL 且 exit 2，专门覆盖上一条 job 测不到的分支
  verify-no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-check must report PARTIAL, never a false green
        shell: bash
        run: |
          set +e
          python -S scripts/verify_skill.py skills/work-discipline > partial-out.txt 2>&1
          code=$?
          set -e
          cat partial-out.txt
          if [ "$code" -ne 2 ]; then
            echo "FAIL: expected exit 2 (PARTIAL), got $code"
            exit 1
          fi
          grep -q "PARTIAL" partial-out.txt || { echo "FAIL: no PARTIAL marker"; exit 1; }
          grep -q "未 Fully 验证" partial-out.txt || { echo "FAIL: false-green wording"; exit 1; }
          echo "PASS: no-dependency branch exits 2 and refuses to claim full verification"

  # 反向测试：正例全过不能证明抓得住错误，这里故意制造两类损坏，断言必须失败
  verify-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Polluted install copy must be rejected
        shell: bash
        run: |
          set -e
          rm -rf /tmp/wd-install-probe && mkdir -p /tmp/wd-install-probe
          cp -r skills/work-discipline/. /tmp/wd-install-probe/
          # 1) 内容漂移：只改一个字节，文件一个不少 —— 必须被 manifest 哈希抓到
          printf '\n<!-- polluted -->\n' >> /tmp/wd-install-probe/SKILL.md
          set +e
          python scripts/verify_skill.py /tmp/wd-install-probe --manifest manifest.json > /tmp/neg-drift.txt 2>&1
          drift=$?
          set -e
          cat /tmp/neg-drift.txt
          if [ "$drift" -eq 0 ]; then echo "FAIL: content drift slipped through"; exit 1; fi
          grep -q "哈希不符" /tmp/neg-drift.txt || { echo "FAIL: drift not attributed to hash"; exit 1; }
          # 2) 缺文件：路由检查必须 FAIL
          rm /tmp/wd-install-probe/references/project-notes.md
          set +e
          python scripts/verify_skill.py /tmp/wd-install-probe --manifest manifest.json > /tmp/neg-missing.txt 2>&1
          missing=$?
          set -e
          cat /tmp/neg-missing.txt
          if [ "$missing" -eq 0 ]; then echo "FAIL: missing file slipped through"; exit 1; fi
          grep -q "缺失" /tmp/neg-missing.txt || { echo "FAIL: missing file not attributed"; exit 1; }
          # 3) 干净副本不带清单：必须 PARTIAL(exit 2)，不许拿仓库清单冒充。
          #    用独立副本，避免上面制造的内容漂移/缺文件让 FAIL 抢先，掩盖 PARTIAL 语义。
          rm -rf /tmp/wd-install-clean && mkdir -p /tmp/wd-install-clean
          cp -r skills/work-discipline/. /tmp/wd-install-clean/
          set +e
          python -S scripts/verify_skill.py /tmp/wd-install-clean > /tmp/neg-nomanifest.txt 2>&1
          nomf=$?
          set -e
          if [ "$nomf" -ne 2 ]; then echo "FAIL: expected exit 2 (PARTIAL) on no-manifest install, got $nomf"; exit 1; fi
          grep -q "安装副本哈希校验" /tmp/neg-nomanifest.txt || { echo "FAIL: no-manifest not reported as PARTIAL"; exit 1; }
          echo "PASS: negative tests caught content drift, missing file, and false-green install check"

  # 文档门禁反向测试：安装树缩进错 / 下载循环漏文件 / 改名后品牌检查不能空转
  verify-negative-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Every generated block must be detectable when corrupted (CN + EN)
        shell: bash
        run: |
          set -e
          cp README.md /tmp/good-cn.md && cp README.en.md /tmp/good-en.md
          # 对四个生成块各注入一行垃圾；中英都测，不靠"代码路径同构"推断
          for key in install-tree bash-download ps-download repo-tree; do
            for f in README.md README.en.md; do
              if [ "$f" = "README.md" ]; then cp /tmp/good-cn.md "$f"; else cp /tmp/good-en.md "$f"; fi
              python - "$f" "$key" <<'PY'
          import io,sys
          fn,key=sys.argv[1],sys.argv[2]
          t=io.open(fn,encoding="utf-8").read()
          marker="<!-- END GENERATED:"+key+" -->"
          i=t.find(marker)
          assert i>0, f"missing marker {key} in {fn}"
          t=t[:i]+"CORRUPTED-LINE\n"+t[i:]
          io.open(fn,"w",encoding="utf-8").write(t)
          PY
              set +e
              python scripts/build_dist.py --check > /tmp/neg-doc.txt 2>&1
              code=$?
              set -e
              [ "$code" -ne 0 ] || { echo "FAIL: $f/$key corruption slipped through"; exit 1; }
              grep -q "$key" /tmp/neg-doc.txt || { echo "FAIL: $f/$key not attributed"; exit 1; }
              echo "  caught $f/$key"
            done
          done
          cp /tmp/good-cn.md README.md && cp /tmp/good-en.md README.en.md
          # 安装目录改名 + 注入品牌字样，品牌检查不许空转
          rm -rf /tmp/wd-renamed && mkdir -p /tmp/wd-renamed
          cp -r skills/work-discipline/. /tmp/wd-renamed/
          printf '\nWorkBuddy injected\n' >> /tmp/wd-renamed/SKILL.md
          set +e
          python scripts/verify_skill.py /tmp/wd-renamed > /tmp/neg-brand.txt 2>&1
          brand=$?
          set -e
          [ "$brand" -ne 0 ] || { echo "FAIL: brand check silently no-op after rename"; exit 1; }
          grep -q "品牌字样" /tmp/neg-brand.txt || { echo "FAIL: brand check did not fire"; exit 1; }
          echo "PASS: all 4 generated blocks × CN/EN caught, plus rename-proof brand check"
